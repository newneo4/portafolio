<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interfaz de escritorio Ubuntu - Portafolio interactivo">
  <title>Ubuntu Desktop Simulator</title>
  <link rel="stylesheet" href="portfolio.css">
  <!-- Adding a font for Ubuntu style -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-center">
      <span class="topbar-item" id="clock">..:..</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-item">🔋</span>
      <span class="topbar-item">📶</span>
      <span class="topbar-item" id="btn-sound" style="cursor:pointer;" title="Silenciar/Reproducir" role="button"
        aria-label="Silenciar o reproducir música">🔇</span>
    </div>
  </div>


  <!-- Dock (Left) -->
  <div class="dock" id="dock"></div>

  <!-- Windows (rendered from JSON) -->
  <div id="windows-root"></div>

  <!-- Audio Player -->
  <audio id="bg-music" loop src="/audio/music.mp3"></audio>

  <script>
    let highestZIndex = 10;

    // --- Audio Logic ---
    const bgMusic = document.getElementById('bg-music');
    const btnSound = document.getElementById('btn-sound');

    // La música inicia APAGADA por defecto. El usuario la enciende con el botón.
    bgMusic.volume = 0.2;
    btnSound.textContent = '🔇';

    btnSound.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        btnSound.textContent = '🔊';
      } else {
        bgMusic.pause();
        btnSound.textContent = '🔇';
      }
    });

    // --- Clock logic ---
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
      document.getElementById('clock').textContent = now.toLocaleDateString('es-ES', options).replace(',', '');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Window Management ---
    function openWindow(id) {
      const win = document.getElementById('win-' + id);
      if (win) {
        win.classList.add('open');
        win.setAttribute('aria-hidden', 'false');
        focusWindow('win-' + id);
      }

      // Update dock indicator
      document.querySelectorAll('.dock-icon').forEach(el => el.classList.remove('active'));
      const activeIcon = Array.from(document.querySelectorAll('.dock-icon'))
        .find(icon => icon.dataset.window === id);
      if (activeIcon) activeIcon.classList.add('active');

      updateEmptyDesktop();
    }

    function closeWindow(id) {
      const win = document.getElementById('win-' + id);
      if (win) {
        win.classList.remove('open');
        win.setAttribute('aria-hidden', 'true');
      }
      updateEmptyDesktop();
    }

    function updateEmptyDesktop() {
      const anyOpen = document.querySelectorAll('.os-window.open').length > 0;
      const emptyDesktopEl = document.getElementById('empty-desktop');
      if (emptyDesktopEl) {
        emptyDesktopEl.classList.toggle('show', !anyOpen);
      }
    }

    function focusWindow(winId) {
      const win = document.getElementById(winId);
      if (win && parseInt(win.style.zIndex || 0) !== highestZIndex) {
        highestZIndex++;
        win.style.zIndex = highestZIndex;
      }
    }

    // --- Drag and Drop ---
    let isDragging = false;
    let dragTarget = null;
    let startX = 0, startY = 0;
    let initialX = 0, initialY = 0;

    function startDrag(e, winId) {
      if (e.target.classList.contains('control-btn')) return; // Ignore clicks on buttons

      isDragging = true;
      dragTarget = document.getElementById(winId);
      focusWindow(winId);

      startX = e.clientX;
      startY = e.clientY;

      const rect = dragTarget.getBoundingClientRect();
      initialX = rect.left;
      initialY = rect.top;

      document.addEventListener('mousemove', drag);
      document.addEventListener('mouseup', stopDrag);
    }

    function drag(e) {
      if (!isDragging || !dragTarget) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      dragTarget.style.left = (initialX + dx) + 'px';
      dragTarget.style.top = (initialY + dy) + 'px';

      // Remove centering transform to prevent conflicts with absolute positioning
      dragTarget.style.transform = 'none';
    }

    function stopDrag() {
      isDragging = false;
      dragTarget = null;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', stopDrag);
    }

    // ── CONTENIDO DATA-DRIVEN (JSON) ────────────────────────────────────────
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // Renders a Yaru icon as an <img>. Si la carga falla (onerror) muestra el emoji como fallback.
    function iconImg(svgName, emojiFallback, cls, alt, ext) {
      const fallback = `<span class="icon-fb">${escapeHtml(emojiFallback || '')}</span>`;
      const fbJson = encodeURIComponent(fallback);
      if (svgName) {
        return `<img src="/icons/yaru/${escapeHtml(svgName)}.${ext || 'svg'}" class="ui-icon ${cls || ''}" alt="${escapeHtml(alt || '')}"
          loading="lazy" onerror="this.outerHTML=decodeURIComponent('${fbJson}')">`;
      }
      return fallback;
    }

    function windowHeader(win) {
      const titleIcon = win.iconSvg
        ? `<img src="/icons/yaru/${escapeHtml(win.iconSvg)}.png" class="ui-icon win-title-icon" alt="" onerror="this.remove()">`
        : '';
      return `
        <div class="window-header" onmousedown="startDrag(event, 'win-${win.id}')">
          <div class="window-title">${titleIcon}${escapeHtml(win.title)}</div>
          <div class="window-controls">
            <button class="control-btn minimize" onclick="closeWindow('${win.id}')" aria-label="Minimizar">_</button>
            <button class="control-btn maximize" aria-label="Maximizar">□</button>
            <button class="control-btn close" onclick="closeWindow('${win.id}')" aria-label="Cerrar">X</button>
          </div>
        </div>`;
    }

    function aboutContent(a) {
      const stats = a.stats.map(s => `
        <div class="stat"><span class="stat-num">${escapeHtml(s.num)}</span><span class="stat-label">${escapeHtml(s.label)}</span></div>`).join('');
      return `
        <h2>${escapeHtml(a.heading)}</h2>
        ${a.paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
        <div class="about-stats">${stats}</div>
        <div class="about-actions">
          <button class="card" style="color: white; cursor:pointer;" onclick="openWindow('${a.primaryAction.window}')">${escapeHtml(a.primaryAction.label)}</button>
          <button class="card cta-contact" style="cursor:pointer;" onclick="openWindow('${a.secondaryAction.window}')">${escapeHtml(a.secondaryAction.label)}</button>
        </div>`;
    }

    function projectsContent(p) {
      const cards = p.items.map(pr => `
        <div class="card project-card" role="button" tabindex="0"
             data-slug="${escapeHtml(pr.slug)}"
             aria-label="Ver detalles de ${escapeHtml(pr.name)}">
          <div class="card-image" style="background: ${pr.gradient};">
            ${pr.cover
          ? `<img class="card-cover" src="${escapeHtml(pr.cover)}" alt="${escapeHtml(pr.name)}" loading="lazy" onerror="window.__coverFail(this, '${escapeHtml(pr.slug)}')">`
          : (pr.glyphSvg ? iconImg(pr.glyphSvg, escapeHtml(pr.glyph), 'glyph') : `<span class="card-glyph">${escapeHtml(pr.glyph)}</span>`)
        }
            <span class="card-open-hint">↗</span>
          </div>
          <div class="card-content">
            <h3>${escapeHtml(pr.name)}</h3>
            <p>${escapeHtml(pr.description)}</p>
            <div class="card-tags">${pr.tags.map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('')}</div>
          </div>
          <div class="card-detail-hint"><span>Ver detalles</span></div>
        </div>`).join('');

      const cta = p.cta ? `
        <div class="project-cta">
          <p>${escapeHtml(p.cta.text)}</p>
          <button class="card cta-contact" style="cursor:pointer;" onclick="openWindow('${p.cta.window}')">${escapeHtml(p.cta.buttonLabel)}</button>
        </div>` : '';

      return `<div class="grid-layout">${cards}</div>${cta}`;
    }

    function skillsContent(skills) {
      return `<div class="skills-categories">${skills.map(cat => `
        <div class="skill-category" style="margin-bottom: 1.5rem;">
          <h3 style="margin-bottom: 0.5rem; color: var(--ubuntu-orange); font-size: 1.1rem;">${escapeHtml(cat.category)}</h3>
          <div class="skills-section">
            ${cat.items.map(s => `<div class="skill-tag">${escapeHtml(s)}</div>`).join('')}
          </div>
        </div>`).join('')}</div>`;
    }

    function educationContent(education) {
      return `<div class="edu-timeline">
        ${education.map((ed, i) => `
          <div class="edu-item ${i === education.length - 1 ? 'edu-item-last' : ''}">
            <div class="edu-track">
              <div class="edu-dot">${ed.iconSvg ? iconImg(ed.iconSvg, escapeHtml(ed.icon || '🎓'), 'edu') : escapeHtml(ed.icon || '🎓')}</div>
            </div>
            <div class="edu-card card" style="cursor: default;">
              <div class="edu-card-top">
                <span class="edu-field">${escapeHtml(ed.field || '')}</span>
                <span class="edu-date">${escapeHtml(ed.date)}</span>
              </div>
              <h3 class="edu-title">${escapeHtml(ed.title)}</h3>
              <p class="edu-institution">${escapeHtml(ed.institution)}</p>
              <p class="edu-meta">${iconImg('location', escapeHtml('📍'), 'location')} ${escapeHtml(ed.location)}</p>
            </div>
          </div>
        `).join('')}
      </div>`;
    }

    function researchContent(research) {
      const badge = research.badge ? `
        <div class="research-badge">
          <span class="research-badge-icon">${iconImg('science', escapeHtml('⚛️'), 'research-badge')}</span>
          <div>
            <h3>${escapeHtml(research.badge.label)}</h3>
            <p>${escapeHtml(research.badge.sub)}</p>
          </div>
        </div>` : '';

      const stats = (research.stats && research.stats.length) ? `
        <div class="research-stats">
          ${research.stats.map(s => `
            <div class="research-stat">
              <span class="research-stat-num">${escapeHtml(s.num)}</span>
              <span class="research-stat-label">${escapeHtml(s.label)}</span>
            </div>
          `).join('')}
        </div>` : '';

      const items = research.items.map(item => `
        <div class="research-card card" style="cursor: default;">
          <div class="research-card-icon">${item.iconSvg ? iconImg(item.iconSvg, escapeHtml(item.icon || '📄'), 'research') : escapeHtml(item.icon || '📄')}</div>
          <div class="research-card-body">
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.description)}</p>
            ${item.tags && item.tags.length ? `<div class="card-tags">${item.tags.map(t => `<span class="card-tag research-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          </div>
        </div>`).join('');

      return `<div class="research-section">
        <div class="research-hero">
          ${badge}
          <div class="research-hero-text">
            <h2 class="research-heading">${escapeHtml(research.heading)}</h2>
            <p>${escapeHtml(research.description)}</p>
          </div>
        </div>
        ${stats}
        <div class="research-items">${items}</div>
      </div>`;
    }

    function cvContent(cv) {
      return `<div class="cv-section" style="height: 100%; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
          <h2 style="margin: 0;">${escapeHtml(cv.heading)}</h2>
          <a href="${escapeHtml(cv.url)}" download class="card cta-contact" style="color: white; padding: 0.5rem 1rem; text-decoration: none; cursor: pointer; text-align: center;">Descargar PDF ↓</a>
        </div>
        <iframe src="${escapeHtml(cv.url)}" style="width: 100%; min-height: 400px; flex-grow: 1; border: none; border-radius: 8px; background: white;"></iframe>
      </div>`;
    }

    function contactContent(c) {
      const links = c.links.map(l => `
        <a href="${escapeHtml(l.url)}" target="_blank" style="color: white; text-decoration: underline;">${escapeHtml(l.label)}</a>`).join('');
      return `
        <h2>${escapeHtml(c.heading)}</h2>
        <p>${escapeHtml(c.intro)}</p>
        <a href="mailto:${escapeHtml(c.email)}" style="font-size: 1.5rem; font-weight:bold; display:block; margin-bottom:0.5rem; color: var(--ubuntu-orange);">${escapeHtml(c.email)}</a>
        <p style="font-size: 1.1rem; margin-bottom: 2rem; color: var(--text-muted);">${iconImg('call', escapeHtml('📞'), 'call')} ${escapeHtml(c.phone)}</p>
        <div style="display: flex; gap: 1rem;">${links}</div>`;
    }

    // ── DETALLE DE PROYECTO (visión Ubuntu / visor de galería) ────────────────
    let APP_DATA = null;
    const detail = { open: false, project: null, index: 0, slides: [], lastCard: null };

    function projectSlides(project) {
      const imgs = (project.detail && project.detail.images && project.detail.images.length)
        ? project.detail.images
        : [];
      if (imgs.length) return imgs.map(src => ({ src }));
      if (project.cover) return [{ src: project.cover }];
      return [{ src: null }];
    }

    window.__coverFail = function (img, slug) {
      const project = APP_DATA && APP_DATA.projects
        ? APP_DATA.projects.items.find(x => x.slug === slug)
        : null;
      if (project && project.glyphSvg) {
        img.outerHTML = iconImg(project.glyphSvg, escapeHtml(project.glyph || '📁'), 'glyph');
      } else {
        img.outerHTML = `<span class="card-glyph">${escapeHtml(project ? project.glyph : '📁')}</span>`;
      }
    };

    function fallbackSlideHtml(project) {
      const glyphHtml = project.glyphSvg
        ? iconImg(project.glyphSvg, escapeHtml(project.glyph), 'glyph slide-glyph')
        : `<span class="card-glyph" style="font-size:4rem;">${escapeHtml(project.glyph)}</span>`;
      return `<div class="detail-fallback" style="background: ${project.gradient};">
        ${glyphHtml}
        <span class="detail-fallback-label">${escapeHtml(project.name)}</span>
      </div>`;
    }

    function buildSlideHtml(item, project) {
      if (item.src) {
        return `<img class="detail-main-image" src="${escapeHtml(item.src)}" alt="${escapeHtml(project.name)}" onerror="window.__projectImgFail(${detail.index})">`;
      }
      return fallbackSlideHtml(project);
    }

    window.__projectImgFail = function (i) {
      if (detail.slides[i]) detail.slides[i].src = null;
      renderDetailStage();
    };

    function renderDetailStage() {
      const win = document.getElementById('win-detail');
      if (!win) return;
      const stage = win.querySelector('.detail-stage');
      const counter = win.querySelector('.detail-counter');
      stage.innerHTML = buildSlideHtml(detail.slides[detail.index], detail.project);
      counter.textContent = `${detail.index + 1} / ${detail.slides.length}`;
      const prev = win.querySelector('.detail-nav-prev');
      const next = win.querySelector('.detail-nav-next');
      prev.disabled = detail.index <= 0;
      next.disabled = detail.index >= detail.slides.length - 1;
    }

    function renderDetailThumbs() {
      const win = document.getElementById('win-detail');
      if (!win) return;
      const wrap = win.querySelector('.detail-thumbs');
      wrap.innerHTML = detail.slides.map((s, i) => `
        <button class="detail-thumb${i === detail.index ? ' active' : ''}" data-i="${i}"
          aria-label="Imagen ${i + 1} de ${detail.slides.length}">
          ${s.src ? `<img src="${escapeHtml(s.src)}" alt="">` : `<span class="thumb-glyph">${escapeHtml(detail.project.glyph)}</span>`}
        </button>`).join('');
      wrap.querySelectorAll('.detail-thumb').forEach(btn => {
        btn.addEventListener('click', () => detailGoto(parseInt(btn.dataset.i, 10)));
      });
    }

    function updateDetailGallery() {
      renderDetailStage();
      renderDetailThumbs();
    }

    function detailPrev() { if (detail.index > 0) { detail.index--; updateDetailGallery(); } }
    function detailNext() { if (detail.index < detail.slides.length - 1) { detail.index++; updateDetailGallery(); } }
    function detailGoto(i) { if (i >= 0 && i < detail.slides.length) { detail.index = i; updateDetailGallery(); } }

    function detailWindowHtml(project) {
      const d = project.detail || {};
      const stack = (d.stack && d.stack.length) ? d.stack : project.tags;
      const props = [
        ['Rol', d.role],
        ['Organizacion', d.client],
        ['Año', d.year],
        ['Stack', stack.join(', ')]
      ].filter(([, v]) => v && v.length).map(([l, v]) => `
        <div class="detail-prop"><span class="prop-label">${escapeHtml(l)}</span><span class="prop-value">${escapeHtml(v)}</span></div>`).join('');

      const features = (d.features || []).map(f => `<li>${escapeHtml(f)}</li>`).join('');
      const hasLinks = d.links && (d.links.demo || d.links.repo);

      return `
        <div class="os-window detail-window" id="win-detail" role="region" aria-label="Detalle de ${escapeHtml(project.name)}" aria-hidden="true" style="z-index: ${++highestZIndex};">
          <div class="window-header" onmousedown="startDrag(event, 'win-detail')">
            <div class="window-title">${escapeHtml(project.name)}</div>
            <div class="window-controls">
              <button class="control-btn minimize" onclick="closeProjectDetail()" aria-label="Minimizar">_</button>
              <button class="control-btn maximize" aria-label="Maximizar">□</button>
              <button class="control-btn close" onclick="closeProjectDetail()" aria-label="Cerrar">X</button>
            </div>
          </div>
          <div class="window-content detail-content" onmousedown="focusWindow('win-detail')">
            <div class="detail-viewer">
              <div class="detail-stage"></div>
              <div class="detail-toolbar">
                <button class="detail-nav detail-nav-prev" aria-label="Imagen anterior">◀</button>
                <span class="detail-counter">1 / 1</span>
                <button class="detail-nav detail-nav-next" aria-label="Imagen siguiente">▶</button>
              </div>
              <div class="detail-thumbs"></div>
            </div>
            <div class="detail-props">${props}</div>
            <div class="detail-text">
              <h3>Acerca del proyecto</h3>
              <p>${escapeHtml(d.description || project.description)}</p>
            </div>
            ${features ? `<div class="detail-text"><h3>Funcionalidades</h3><ul class="detail-features">${features}</ul></div>` : ''}
            <div class="detail-actions">
              ${hasLinks ? `
                ${d.links.demo ? `<a class="detail-action" href="${escapeHtml(d.links.demo)}" target="_blank" rel="noopener">${iconImg('web', escapeHtml('🌐'), 'detail')} Ver demo</a>` : ''}
                ${d.links.repo ? `<a class="detail-action" href="${escapeHtml(d.links.repo)}" target="_blank" rel="noopener">${iconImg('keyboard', escapeHtml('⌨'), 'detail')} Ver código</a>` : ''}` : ''}
              <button class="detail-action detail-back" onclick="closeProjectDetail()">← Volver a los proyectos</button>
            </div>
          </div>
        </div>`;
    }

    function openProjectDetail(slug) {
      const project = APP_DATA && APP_DATA.projects.items.find(p => p.slug === slug);
      if (!project) return;

      const card = document.querySelector(`.project-card[data-slug="${slug}"]`);
      if (card) detail.lastCard = card;

      const existing = document.getElementById('win-detail');
      if (existing) existing.remove();

      document.getElementById('windows-root').insertAdjacentHTML('beforeend', detailWindowHtml(project));

      const win = document.getElementById('win-detail');
      win.classList.add('open');
      win.setAttribute('aria-hidden', 'false');
      focusWindow('win-detail');

      detail.open = true;
      detail.project = project;
      detail.index = 0;
      detail.slides = projectSlides(project);

      win.querySelector('.detail-nav-prev').addEventListener('click', detailPrev);
      win.querySelector('.detail-nav-next').addEventListener('click', detailNext);
      bindMaximize();
      updateDetailGallery();
      updateEmptyDesktop();
    }

    function closeProjectDetail() {
      const win = document.getElementById('win-detail');
      if (!win) return;
      win.classList.remove('open');
      win.setAttribute('aria-hidden', 'true');
      detail.open = false;
      setTimeout(() => {
        if (win.parentNode) win.parentNode.removeChild(win);
      }, 250);
      updateEmptyDesktop();
      if (detail.lastCard && document.body.contains(detail.lastCard)) {
        detail.lastCard.focus();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!detail.open) return;
      if (e.key === 'Escape') { closeProjectDetail(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { detailPrev(); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { detailNext(); e.preventDefault(); }
    });

    function renderWindow(win, data) {
      const contentFns = {
        about: aboutContent,
        projects: projectsContent,
        education: educationContent,
        research: researchContent,
        cv: cvContent,
        skills: skillsContent,
        contact: contactContent
      };
      const fn = contentFns[win.type];
      if (!fn) return '';
      const zStyle = win.z ? ` style="z-index: ${win.z};"` : '';
      return `
        <div class="os-window" id="win-${win.id}"${zStyle} role="region" aria-label="${escapeHtml(win.title)}" aria-hidden="true">
          ${windowHeader(win)}
          <div class="window-content" onmousedown="focusWindow('win-${win.id}')">
            ${fn(data[win.type])}
          </div>
        </div>`;
    }

    function renderDock(windows) {
      const dock = document.getElementById('dock');

      dock.innerHTML = windows.map((w, i) => `
        <div class="dock-icon${i === 0 ? ' active' : ''}" data-window="${w.id}" role="button" tabindex="0"
             aria-label="Abrir ${escapeHtml(w.title)}" title="${escapeHtml(w.title)}">${iconImg(w.iconSvg, escapeHtml(w.icon), 'dock-img', escapeHtml(w.title), 'png')}</div>`).join('');

      dock.querySelectorAll('.dock-icon').forEach(icon => {
        icon.addEventListener('click', () => openWindow(icon.dataset.window));
        icon.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            openWindow(icon.dataset.window);
            e.preventDefault();
          }
        });
      });
    }

    // --- Maximize Logic (after windows exist) ---
    function bindMaximize() {
      document.querySelectorAll('.control-btn.maximize').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const win = e.target.closest('.os-window');
          if (win) {
            win.classList.toggle('maximized');
            focusWindow(win.id);
          }
        });
      });
    }

    (async function init() {
      try {
        const res = await fetch('/data/portfolio.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        APP_DATA = data;

        renderDock(data.windows);
        document.getElementById('windows-root').innerHTML =
          data.windows.map(w => renderWindow(w, data)).join('');
        bindMaximize();

        // Cards de proyectos → abren el detalle (clic / teclado)
        document.querySelectorAll('.project-card').forEach(card => {
          card.addEventListener('click', () => openProjectDetail(card.dataset.slug));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              openProjectDetail(card.dataset.slug);
              e.preventDefault();
            }
          });
        });

        // Open the about window by default
        setTimeout(() => {
          openWindow('about');
        }, 500);
      } catch (err) {
        document.getElementById('windows-root').innerHTML = `
          <div class="empty-desktop show">
            <span class="empty-icon">${iconImg('warning', escapeHtml('⚠️'), 'empty')}</span>
            <p>No se pudo cargar el contenido</p>
            <p class="empty-sub">${escapeHtml(err.message)}</p>
          </div>`;
      }
    })();
  </script>
</body>

</html>
